<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dailies extension settings</title>
<style>
  :root { --paper:#eceeea; --surface:#f7f8f5; --ink:#1a2124; --muted:#5b6669; --line:#d3d8d4; --accent:#a9531b;
    --accent-ink:#fff; --ok:#2e7d4f; --bad:#b3261e; --strip:#5a3720; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper:#1c2225; --surface:#232a2e; --ink:#e7ebe8; --muted:#95a19f;
    --line:#334045; --accent:#e08a45; --accent-ink:#1d1208; --ok:#6cc58e; --bad:#f07a6a; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  .card { background: var(--surface); border-top: 8px solid var(--strip); border-radius: 4px; padding: 20px 24px 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px 10px; font: inherit;
    color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
  button { cursor: pointer; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 4px; border: 0;
    background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .6; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: 16px 0 0; color: var(--ink); white-space: pre-line; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Connect to Dailies</h1>
    <p>Find both values on Dailies' YouTube page, under <b>Use your own Chrome</b>.</p>
    <form id="f">
      <label>Dailies address <input id="server" placeholder="http://192.168.1.64:8945" required></label>
      <label>Extension key <input id="key" placeholder="dly_…" required autocomplete="off" spellcheck="false"></label>
      <button id="save">Save and connect</button>
    </form>
    <p id="status" role="status"></p>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
